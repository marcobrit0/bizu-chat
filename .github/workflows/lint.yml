name: Lint
on:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bizu_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run database migrations
        run: pnpm db:migrate
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/bizu_test
      - name: Run database integration tests
        run: pnpm test:db
        env:
          TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/bizu_test
      - name: Run check
        run: pnpm check
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Unit tests
        run: pnpm test:unit
      - name: Build
        run: pnpm exec next build
        env:
          # `pnpm build` would also run migrations, which needs a live database.
          # Build the app only — migrations are covered by the deploy pipeline.
          AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
