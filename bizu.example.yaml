# Bizu Chat Configuration
# Copy this file to bizu.yaml and customize as needed
# For more information, see: https://www.bizu.ai/docs/configuration/bizu_yaml

version: 1.2.1

cache: true

# Custom interface — simplified for Bizu
interface:
  customWelcome: 'Bem-vindo ao Bizu! Seu assistente de IA.'
  # Disable features not needed for v1
  agents: false
  presets: false
  prompts: false
  bookmarks: false
  multiConvo: false
  fileSearch: false
  endpointsMenu: false
  sidePanel: false
  modelSelect: false
  parameters: true
  fileCitations: false
  marketplace:
    use: false

  # Privacy & Terms (update URLs when you have real ones)
  privacyPolicy:
    externalUrl: 'https://bizu.chat/privacidade'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://bizu.chat/termos'
    openNewTab: true
    modalAcceptance: true
    modalTitle: 'Termos de Uso do Bizu'
    modalContent: |
      # Termos de Uso do Bizu

      *Data de vigência: Março de 2026*

      Bem-vindo ao Bizu, sua plataforma de assistente de IA. Ao utilizar nossos serviços, você concorda com estes termos.

      ## 1. Uso do Serviço
      O Bizu é uma plataforma de chat com inteligência artificial. Você se compromete a usar o serviço de forma ética e legal.

      ## 2. Dados do Usuário
      Coletamos informações necessárias para fornecer o serviço, como nome, e-mail e dados de uso. Consulte nossa Política de Privacidade para mais detalhes.

      ## 3. Limitações
      O Bizu utiliza modelos de IA que podem gerar respostas imprecisas. Não nos responsabilizamos pelo conteúdo gerado pela IA.

      ## 4. Alterações
      Reservamo-nos o direito de modificar estes termos a qualquer momento, notificando os usuários por e-mail.

      Ao usar o Bizu, você reconhece que leu e concorda com estes Termos de Uso.

balance:
  enabled: true
  startBalance: 100000
  autoRefillEnabled: true
  refillIntervalValue: 30
  refillIntervalUnit: 'days'
  refillAmount: 100000
  # Cap total auto-refills per user (0 = unlimited). Set before Stripe integration.
  maxRefillCount: 3

registration:
  socialLogins: []

# Model specs — show actual model display names so users know exactly which model they're using.
# Never rename models with brand names; use the real model name as the label.
modelSpecs:
  enforce: true
  prioritize: true
  list:
    # ── Free Tier Models ──

    # DeepSeek V3.2 — flagship default model
    - name: 'deepseek-v3.2'
      label: 'DeepSeek V3.2'
      description: 'Nosso modelo principal — raciocínio classe GPT-5, contexto de 164K tokens'
      default: true
      preset:
        endpoint: 'OpenRouter'
        model: 'deepseek/deepseek-v3.2'

    # DeepSeek V3 (free) — rate-limited free fallback
    - name: 'deepseek-v3-free'
      label: 'DeepSeek V3'
      description: 'Versão gratuita com limite de requisições — ótimo para uso leve'
      preset:
        endpoint: 'OpenRouter'
        model: 'deepseek/deepseek-chat-v3-0324:free'

    # Llama 4 Maverick — Meta's best open model
    - name: 'llama-4-maverick'
      label: 'Llama 4 Maverick'
      description: 'Melhor modelo aberto da Meta — excelente para seguir instruções'
      preset:
        endpoint: 'OpenRouter'
        model: 'meta-llama/llama-4-maverick:free'

    # Qwen3 235B — excellent multilingual, strong reasoning
    - name: 'qwen3-235b'
      label: 'Qwen3 235B'
      description: 'Modelo 235B MoE — excelente raciocínio e multilíngue, ótimo em PT-BR'
      preset:
        endpoint: 'OpenRouter'
        model: 'qwen/qwen3-235b-a22b:free'

    # Gemma 3 27B — Google's open model
    - name: 'gemma-3-27b'
      label: 'Gemma 3 27B'
      description: 'Modelo aberto do Google — limpo, rápido e versátil'
      preset:
        endpoint: 'OpenRouter'
        model: 'google/gemma-3-27b-it:free'

    # Llama 3.3 70B — reliable workhorse
    - name: 'llama-3.3-70b'
      label: 'Llama 3.3 70B'
      description: 'Modelo robusto e confiável — bom substituto quando outros estão limitados'
      preset:
        endpoint: 'OpenRouter'
        model: 'meta-llama/llama-3.3-70b-instruct:free'

    # Mistral Small 3 — fast and extremely cheap
    - name: 'mistral-small-3'
      label: 'Mistral Small 3'
      description: '24B parâmetros, 3x mais rápido que Llama 70B — extremamente econômico'
      preset:
        endpoint: 'OpenRouter'
        model: 'mistralai/mistral-small-24b-instruct-2501'

    # ── Premium Tier Models ──

    # Gemini 2.5 Flash — Google's reasoning workhorse
    - name: 'gemini-2.5-flash'
      label: 'Gemini 2.5 Flash'
      description: 'Contexto de 1M, raciocínio avançado — excelente custo-benefício do Google'
      preset:
        endpoint: 'OpenRouter'
        model: 'google/gemini-2.5-flash'

    # Gemini 2.5 Flash Lite — even cheaper, speed-focused
    - name: 'gemini-2.5-flash-lite'
      label: 'Gemini 2.5 Flash Lite'
      description: 'Mais barato e rápido — para quem prioriza velocidade'
      preset:
        endpoint: 'OpenRouter'
        model: 'google/gemini-2.5-flash-lite'

    # Grok 4.1 Fast — near-frontier quality at high speed
    - name: 'grok-4.1-fast'
      label: 'Grok 4.1 Fast'
      description: 'Contexto de 2M, melhor modelo agentic da xAI — rápido e acessível'
      preset:
        endpoint: 'OpenRouter'
        model: 'x-ai/grok-4.1-fast'

    # Claude Haiku 4.5 — best "Claude feel" at budget price
    - name: 'claude-haiku-4.5'
      label: 'Claude Haiku 4.5'
      description: 'Qualidade Anthropic acessível — contexto de 200K, 73%+ SWE-bench'
      preset:
        endpoint: 'OpenRouter'
        model: 'anthropic/claude-haiku-4.5'

    # Qwen3.5 Plus — excellent reasoning, strong PT-BR
    - name: 'qwen3.5-plus'
      label: 'Qwen3.5 Plus'
      description: 'Arquitetura híbrida MoE — contexto de 1M, visão nativa, forte em PT-BR'
      preset:
        endpoint: 'OpenRouter'
        model: 'qwen/qwen3.5-plus-02-15'

    # DeepSeek R1 — chain-of-thought reasoning model
    - name: 'deepseek-r1'
      label: 'DeepSeek R1'
      description: 'Modelo de raciocínio — pensamento visível passo a passo'
      preset:
        endpoint: 'OpenRouter'
        model: 'deepseek/deepseek-r1'

    # Mistral Small 3.1 — fast with 128K context
    - name: 'mistral-small-3.1'
      label: 'Mistral Small 3.1'
      description: '24B parâmetros, contexto de 128K — multimodal, rápido e versátil'
      preset:
        endpoint: 'OpenRouter'
        model: 'mistralai/mistral-small-3.1-24b-instruct'

    # Z.AI GLM 4.7 — strong multilingual reasoning
    - name: 'glm-4.7'
      label: 'Z.AI GLM 4.7'
      description: 'Contexto de 200K, programação e raciocínio avançado — da Zhipu AI'
      preset:
        endpoint: 'OpenRouter'
        model: 'z-ai/glm-4.7'

# Models via OpenRouter
endpoints:
  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default:
          # Free Tier
          - 'deepseek/deepseek-v3.2'
          - 'deepseek/deepseek-chat-v3-0324:free'
          - 'meta-llama/llama-4-maverick:free'
          - 'qwen/qwen3-235b-a22b:free'
          - 'google/gemma-3-27b-it:free'
          - 'meta-llama/llama-3.3-70b-instruct:free'
          - 'mistralai/mistral-small-24b-instruct-2501'
          # Premium Tier
          - 'google/gemini-2.5-flash'
          - 'google/gemini-2.5-flash-lite'
          - 'x-ai/grok-4.1-fast'
          - 'anthropic/claude-haiku-4.5'
          - 'qwen/qwen3.5-plus-02-15'
          - 'deepseek/deepseek-r1'
          - 'mistralai/mistral-small-3.1-24b-instruct'
          - 'z-ai/glm-4.7'
        fetch: false
      titleConvo: true
      titleModel: 'deepseek/deepseek-v3.2'
      dropParams: ['stop']
