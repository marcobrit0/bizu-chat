# Bizu Chat Configuration
# For more information, see: https://www.librechat.ai/docs/configuration/librechat_yaml

version: 1.2.1

cache: true

# Custom interface — simplified for Bizu
interface:
  customWelcome: 'Bem-vindo ao Bizu! Seu assistente de IA.'
  # Disable features not needed for v1
  agents: false
  presets: false
  prompts: false
  bookmarks: false
  multiConvo: false
  fileSearch: false
  endpointsMenu: false
  sidePanel: false
  modelSelect: false
  parameters: true
  fileCitations: false
  marketplace:
    use: false

  # Privacy & Terms (update URLs when you have real ones)
  privacyPolicy:
    externalUrl: 'https://bizu.chat/privacidade'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://bizu.chat/termos'
    openNewTab: true
    modalAcceptance: true
    modalTitle: 'Termos de Uso do Bizu'
    modalContent: |
      # Termos de Uso do Bizu

      *Data de vigência: Março de 2026*

      Bem-vindo ao Bizu, sua plataforma de assistente de IA. Ao utilizar nossos serviços, você concorda com estes termos.

      ## 1. Uso do Serviço
      O Bizu é uma plataforma de chat com inteligência artificial. Você se compromete a usar o serviço de forma ética e legal.

      ## 2. Dados do Usuário
      Coletamos informações necessárias para fornecer o serviço, como nome, e-mail e dados de uso. Consulte nossa Política de Privacidade para mais detalhes.

      ## 3. Limitações
      O Bizu utiliza modelos de IA que podem gerar respostas imprecisas. Não nos responsabilizamos pelo conteúdo gerado pela IA.

      ## 4. Alterações
      Reservamo-nos o direito de modificar estes termos a qualquer momento, notificando os usuários por e-mail.

      Ao usar o Bizu, você reconhece que leu e concorda com estes Termos de Uso.

balance:
  enabled: true
  startBalance: 5000
  autoRefillEnabled: true
  refillIntervalValue: 30
  refillIntervalUnit: 'days'
  refillAmount: 5000
  # 0 = unlimited refills — free tier is free forever, just capped monthly.
  maxRefillCount: 0

registration:
  socialLogins: []

# Rate limits — protect against abuse.
# Message limits (per-minute) are set via env vars: MESSAGE_IP_MAX, MESSAGE_USER_MAX, etc.
rateLimits:
  fileUploads:
    ipMax: 50
    ipWindowInMinutes: 15
    userMax: 25
    userWindowInMinutes: 15
  conversationsImport:
    ipMax: 20
    ipWindowInMinutes: 15
    userMax: 10
    userWindowInMinutes: 15

# Model specs — show actual model display names so users know exactly which model they're using.
# Never rename models with brand names; use the real model name as the label.
modelSpecs:
  enforce: true
  prioritize: true
  list:
    # ── Free Tier Models (all users) ──

    # DeepSeek V3.2 — flagship default model
    - name: 'deepseek-v3.2'
      label: 'DeepSeek V3.2'
      description: 'Nosso modelo principal — raciocínio classe GPT-5, contexto de 164K tokens'
      default: true
      preset:
        endpoint: 'OpenRouter'
        model: 'deepseek/deepseek-v3.2'

    # Llama 4 Maverick — Meta's best open model
    - name: 'llama-4-maverick'
      label: 'Llama 4 Maverick'
      description: 'Melhor modelo aberto da Meta — excelente para seguir instruções'
      preset:
        endpoint: 'OpenRouter'
        model: 'meta-llama/llama-4-maverick:free'

    # Qwen3 235B — excellent multilingual, strong reasoning
    - name: 'qwen3-235b'
      label: 'Qwen3 235B'
      description: 'Modelo 235B MoE — excelente raciocínio e multilíngue, ótimo em PT-BR'
      preset:
        endpoint: 'OpenRouter'
        model: 'qwen/qwen3-235b-a22b:free'

    # ── Premium Tier Models (pro plan — R$20/mês) ──

    # Gemini 2.5 Flash — Google's reasoning workhorse
    - name: 'gemini-2.5-flash'
      label: 'Gemini 2.5 Flash'
      description: 'Contexto de 1M, raciocínio avançado — excelente custo-benefício do Google'
      preset:
        endpoint: 'OpenRouter'
        model: 'google/gemini-2.5-flash'

    # DeepSeek R1 — chain-of-thought reasoning model
    - name: 'deepseek-r1'
      label: 'DeepSeek R1'
      description: 'Modelo de raciocínio — pensamento visível passo a passo'
      preset:
        endpoint: 'OpenRouter'
        model: 'deepseek/deepseek-r1'

    # Grok 4.1 Fast — near-frontier quality at high speed
    - name: 'grok-4.1-fast'
      label: 'Grok 4.1 Fast'
      description: 'Contexto de 2M, rápido e acessível — da xAI'
      preset:
        endpoint: 'OpenRouter'
        model: 'x-ai/grok-4.1-fast'

# Models via OpenRouter
endpoints:
  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default:
          # Free Tier
          - 'deepseek/deepseek-v3.2'
          - 'meta-llama/llama-4-maverick:free'
          - 'qwen/qwen3-235b-a22b:free'
          # Premium Tier
          - 'google/gemini-2.5-flash'
          - 'deepseek/deepseek-r1'
          - 'x-ai/grok-4.1-fast'
        fetch: false
      titleConvo: true
      titleModel: 'deepseek/deepseek-v3.2'
      dropParams: ['stop']
